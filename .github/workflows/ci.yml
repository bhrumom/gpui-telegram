name: GPUI Telegram Turbo CI

on:
  push:
    branches: [main, master, dev]
    paths-ignore:
      - "**.md"
      - "!docs/specs/**"
      - "LICENSE*"
      - ".gitignore"
  pull_request:
    paths-ignore:
      - "**.md"
      - "!docs/specs/**"
      - "LICENSE*"
      - ".gitignore"
  workflow_dispatch:

concurrency:
  group: gpui-telegram-turbo-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "0"
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: "sccache"
  CI: "true"

jobs:
  ledger-parity-audit:
    name: Ledger Closure & Static Parity Audit (3,441 Upstream Files)
    runs-on: ubuntu-24.04
    needs: [macos-gpui-verify]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: gpui-telegram-desktop-macos-arm64-fast
          path: target/release
      - name: Stage Packaged App Bundle from CI Artifact
        run: |
          chmod +x target/release/gpui_telegram_desktop
          chmod +x target/release/fabushi || true
          chmod +x target/release/fabushi-remote-daemon || true
          python3 scripts/package_release.py --skip-clean
      - name: Run 6-Gate Source-File Parity Ledger Verification
        run: python3 scripts/verify_ledger_closure.py --ci-without-upstream --skip-cargo

  linux-fast-verify:
    name: Linux Turbo Check & Nextest (mold + sccache)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Cache Linux APT Packages (mold + GPUI headers)
        uses: actions/cache@v4
        with:
          path: ~/apt-cache
          key: apt-ubuntu24-mold-gpui-v1
      - name: Install Linux Dependencies & mold Linker
        run: |
          PKGS="mold clang pkg-config protobuf-compiler libclang-dev libssl-dev libegl-dev libgl-dev libgles2-mesa-dev libpipewire-0.3-dev libspa-0.2-dev libgbm-dev libdrm-dev libdbus-1-dev libzstd-dev libsqlite3-dev libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libxcursor-dev libvulkan-dev libasound2-dev libfontconfig1-dev libfreetype6-dev"
          if [ -f ~/apt-cache/debs.tar.zst ]; then
            sudo tar --zstd -xf ~/apt-cache/debs.tar.zst -C /
            sudo apt-get install -y --no-install-recommends --no-upgrade $PKGS
          else
            mkdir -p ~/apt-cache
            sudo rm -f /var/cache/apt/archives/*.deb
            sudo apt-get update -o Acquire::Languages=none
            sudo apt-get install -y -d --no-install-recommends $PKGS
            sudo tar --zstd -cf ~/apt-cache/debs.tar.zst /var/cache/apt/archives /var/lib/apt/lists
            sudo chown -R "$USER:$USER" ~/apt-cache
            sudo apt-get install -y --no-install-recommends $PKGS
          fi
      - uses: dtolnay/rust-toolchain@stable
      - uses: mozilla-actions/sccache-action@v0.0.11
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          shared-key: "ubuntu-24-turbo-v1"
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Run Parallel Nextest & Workspace Binary Check on Linux
        run: |
          cargo nextest run --profile ci \
            -p gpui_telegram_core \
            -p gpui_telegram_proto \
            -p orca_core \
            -p orca_bots \
            -p orca_ide \
            -p fabushi_remote_engine \
            -p gpui_telegram_server \
            -p gpui_telegram_client \
            -p gpui_telegram_cli \
            --lib
          cargo nextest run --profile ci \
            -p gpui_telegram_community --features storage \
            --lib
          cargo nextest run --profile ci \
            -p fabushi_remote_daemon --bins \
            -p fabushi_remote_engine --test engine_tests \
            -p gpui_telegram_proto --test proto_tests --test api_rpc_endpoints_tests \
            -p gpui_telegram_agent --test hermes_engine_tests --test community_tools_tests \
            -p gpui_telegram_server --test db_pts_messaging_tests --test server_routes_auth_tests --test hermes_gateway_and_bot_bugfix_tests --test mcp_oauth_official_mcp_remote_assist_tests --test community_rest_auth_media_tests --test community_bot_api_hermes_ws_tests \
            -p gpui_telegram_client --test auth_client_tests --test community_client_tests \
            -p gpui_telegram_cli --test cli_integration_tests \
            -p gpui_telegram_desktop --test tdesktop_full_parity_integration_tests --test desktop_views_tests --test hermes_desktop_bugfix_tests --test remote_control_ui_tests --test community_shell_feed_tests --test community_views_full_tests
          cargo check --workspace --lib --bins
      - name: Report sccache Hit Statistics & Clean Temp Garbage
        run: |
          sccache --show-stats || true
          python3 scripts/clean_build_garbage.py

  macos-gpui-verify:
    name: macOS Apple Silicon Turbo Check & Nextest (sccache)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Verify Metal Toolchain & Protobuf
        run: |
          xcrun -sdk macosx metal -v >/dev/null 2>&1 || xcodebuild -downloadComponent MetalToolchain || true
          command -v protoc >/dev/null 2>&1 || HOMEBREW_NO_AUTO_UPDATE=1 brew install protobuf
          command -v cmake >/dev/null 2>&1 || HOMEBREW_NO_AUTO_UPDATE=1 brew install cmake
      - uses: dtolnay/rust-toolchain@stable
      - uses: mozilla-actions/sccache-action@v0.0.11
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          shared-key: "macos-15-turbo-v1"
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Run Parallel Nextest & Workspace Binary Check on macOS
        run: |
          cargo nextest run --profile ci \
            -p gpui_telegram_core \
            -p gpui_telegram_proto \
            -p orca_core \
            -p orca_bots \
            -p orca_ide \
            -p fabushi_remote_engine \
            -p gpui_telegram_media \
            -p gpui_telegram_webrtc \
            -p gpui_telegram_agent \
            -p gpui_telegram_server \
            -p gpui_telegram_client \
            -p gpui_telegram_cli \
            --lib
          cargo nextest run --profile ci \
            -p gpui_telegram_community --features storage \
            --lib
          cargo nextest run --profile ci \
            -p fabushi_remote_daemon --bins \
            -p fabushi_remote_engine --test engine_tests \
            -p gpui_telegram_proto --test proto_tests --test api_rpc_endpoints_tests \
            -p gpui_telegram_media --test waveform_5bit_codec_roundtrip \
            -p gpui_telegram_agent --test agent_runtime_tests --test mcp_cua_talk_tests --test hermes_engine_tests --test community_tools_tests \
            -p gpui_telegram_server --test db_pts_messaging_tests --test server_routes_auth_tests --test hermes_gateway_and_bot_bugfix_tests --test mcp_oauth_official_mcp_remote_assist_tests --test community_rest_auth_media_tests --test community_bot_api_hermes_ws_tests \
            -p gpui_telegram_client --test auth_client_tests --test community_client_tests \
            -p gpui_telegram_cli --test cli_integration_tests \
            -p gpui_telegram_desktop \
              --test tdesktop_full_parity_integration_tests \
              --test desktop_views_tests \
              --test hermes_desktop_bugfix_tests \
              --test remote_control_ui_tests \
              --test auth_wizard_tabs_tests \
              --test dialogs_widget_subsystem_tests \
              --test window_themes_subsystem_tests \
              --test milestone_1_nav_calls_regression_tests \
              --test milestone_3_settings_regression_tests \
              --test community_shell_feed_tests \
              --test community_views_full_tests
          cargo check --workspace --lib --bins
          cargo build --profile ci --bin gpui_telegram_desktop --bin fabushi --bin fabushi-remote-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: gpui-telegram-desktop-macos-arm64-fast
          path: |
            target/ci/gpui_telegram_desktop
            target/ci/fabushi
            target/ci/fabushi-remote-daemon
          retention-days: 7
      - name: Report sccache Hit Statistics & Clean Temp Garbage
        run: |
          sccache --show-stats || true
          python3 scripts/clean_build_garbage.py

  windows-gpui-verify:
    name: Windows x86_64 Turbo Check & Binary Build
    runs-on: windows-latest
    env:
      RUSTC_WRAPPER: ""
      SCCACHE_GHA_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - name: Setup Protobuf Compiler (protoc)
        uses: arduino/setup-protoc@v3
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          shared-key: "windows-latest-turbo-v1"
      - name: Check & Build Windows Desktop, Server & CLI Binaries
        shell: bash
        run: |
          set -euo pipefail
          cargo check --workspace --lib --bins
          cargo test --profile ci -p fabushi_remote_engine --test engine_tests
          cargo test --profile ci -p gpui_telegram_client --lib config::tests
          cargo test --profile ci -p gpui_telegram_community --features sqlite --lib
          cargo test --profile ci -p orca_core --lib
          cargo build --profile ci --bin gpui_telegram_desktop --bin fabushi --bin fabushi-remote-daemon
      - name: Clean Temp Garbage
        shell: bash
        run: |
          python scripts/clean_build_garbage.py

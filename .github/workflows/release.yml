name: GPUI Telegram Release Packaging

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Existing GitHub Release tag to upload assets to (optional)"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: gpui-telegram-release-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: "sccache"
  CI: "true"

jobs:
  release-macos-arm64:
    name: Build, Sign & Notarize macOS arm64 Installer (16-CGU ThinLTO)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Verify Apple Signing & Notarization Secrets
        shell: bash
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$MACOS_CERTIFICATE_P12_BASE64" ] || [ -z "$MACOS_CERTIFICATE_PASSWORD" ]; then
            echo "::error::MACOS_CERTIFICATE_P12_BASE64 / MACOS_CERTIFICATE_PASSWORD org secrets are missing."
            exit 1
          fi
          if { [ -z "$APPLE_ID" ] || [ -z "$APPLE_APP_SPECIFIC_PASSWORD" ]; } && \
             { [ -z "$APP_STORE_CONNECT_API_KEY_ID" ] || [ -z "$APP_STORE_CONNECT_API_ISSUER_ID" ] || [ -z "$APP_STORE_CONNECT_API_KEY_BASE64" ]; }; then
            echo "::error::Apple notarization credentials are not configured."
            exit 1
          fi
      - name: Import Apple Developer ID Certificate into Temporary Keychain
        shell: bash
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          CONFIGURED_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/fabushi-signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          cert="$RUNNER_TEMP/apple-signing.p12"
          echo "$MACOS_CERTIFICATE_P12_BASE64" | base64 --decode > "$cert"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$cert" -k "$keychain" -P "$MACOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/productsign -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain"
          security default-keychain -d user -s "$keychain"
          rm -f "$cert"

          identity="$CONFIGURED_IDENTITY"
          if [ -z "$identity" ]; then
            identity="$(security find-identity -v -p codesigning "$keychain" | awk -F '"' '/Developer ID Application/ {print $2; exit}')"
          fi
          case "$identity" in
            *'Developer ID Application:'*) ;;
            *)
              echo "::error::Developer ID Application identity was not found in keychain."
              security find-identity -v "$keychain"
              exit 1
              ;;
          esac
          echo "MACOS_CODESIGN_IDENTITY=$identity" >> "$GITHUB_ENV"

          installer_identity="$(security find-identity -v "$keychain" | awk -F '"' '/Developer ID Installer/ {print $2; exit}' || true)"
          if [ -n "$installer_identity" ]; then
            echo "MACOS_INSTALLER_IDENTITY=$installer_identity" >> "$GITHUB_ENV"
            echo "Found Developer ID Installer identity: $installer_identity"
          else
            echo "No Developer ID Installer identity in P12; will ship signed+notarized DMG with 1-click Install Fabushi.app."
          fi

          codesign_with_retry() {
            local attempt=1
            local max_attempts=6
            while true; do
              if codesign "$@"; then
                return 0
              fi
              if [ "$attempt" -ge "$max_attempts" ]; then
                echo "::error::codesign failed after ${max_attempts} attempts: $*"
                return 1
              fi
              local delay=$((attempt * 5))
              echo "codesign transient failure (attempt ${attempt}/${max_attempts}); retrying in ${delay}s..."
              sleep "$delay"
              attempt=$((attempt + 1))
            done
          }

          probe="$RUNNER_TEMP/fabushi-team-probe"
          cp /usr/bin/true "$probe"
          codesign_with_retry --force --options runtime --timestamp --sign "$identity" "$probe"
          team_id="$(codesign -dv --verbose=4 "$probe" 2>&1 | awk -F= '/^TeamIdentifier=/{print $2; exit}')"
          rm -f "$probe"
          test -n "$team_id"
          echo "APPLE_TEAM_ID_RESOLVED=$team_id" >> "$GITHUB_ENV"
          echo "SIGNING_KEYCHAIN_PATH=$keychain" >> "$GITHUB_ENV"
          security find-identity -v -p codesigning "$keychain"
      - name: Verify Metal Toolchain & Protobuf
        run: |
          xcrun -sdk macosx metal -v >/dev/null 2>&1 || xcodebuild -downloadComponent MetalToolchain || true
          command -v protoc >/dev/null 2>&1 || HOMEBREW_NO_AUTO_UPDATE=1 brew install protobuf
          command -v cmake >/dev/null 2>&1 || HOMEBREW_NO_AUTO_UPDATE=1 brew install cmake
      - uses: dtolnay/rust-toolchain@stable
      - uses: mozilla-actions/sccache-action@v0.0.11
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          shared-key: "macos-15-release-lto16-v1"
      - name: Build, Sign & Notarize Fabushi.app, Install Fabushi.app & DMG
        env:
          MACOS_CODESIGN_IDENTITY: ${{ env.MACOS_CODESIGN_IDENTITY }}
          MACOS_INSTALLER_IDENTITY: ${{ env.MACOS_INSTALLER_IDENTITY }}
          APPLE_TEAM_ID: ${{ env.APPLE_TEAM_ID_RESOLVED }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          APPLE_NOTARIZE: "1"
        run: |
          set -euo pipefail
          codesign_with_retry() {
            local attempt=1
            local max_attempts=6
            while true; do
              if codesign "$@"; then
                return 0
              fi
              if [ "$attempt" -ge "$max_attempts" ]; then
                echo "::error::codesign failed after ${max_attempts} attempts: $*"
                return 1
              fi
              local delay=$((attempt * 5))
              echo "codesign transient failure (attempt ${attempt}/${max_attempts}); retrying in ${delay}s..."
              sleep "$delay"
              attempt=$((attempt + 1))
            done
          }

          TAG_NAME="${{ inputs.tag_name || github.ref_name }}"
          VERSION="${TAG_NAME#v}"
          cargo build --release --bin gpui_telegram_desktop --bin gpui_telegram_server --bin fabushi --bin fabushi-remote-daemon
          codesign_with_retry --force --options runtime --timestamp --sign "$MACOS_CODESIGN_IDENTITY" target/release/gpui_telegram_server
          codesign_with_retry --force --options runtime --timestamp --sign "$MACOS_CODESIGN_IDENTITY" target/release/fabushi
          codesign_with_retry --force --options runtime --timestamp --sign "$MACOS_CODESIGN_IDENTITY" target/release/fabushi-remote-daemon
          python3 scripts/package_release.py --version "$VERSION" --skip-clean --notarize
          sccache --show-stats || true
      - name: Verify Gatekeeper Assessment & /Applications Install Smoke Test
        shell: bash
        run: |
          set -euo pipefail
          dmg="$(ls dist/Fabushi-*-macos-*.dmg | head -n 1)"
          test -f "$dmg"
          xcrun stapler validate -v "$dmg"
          mount_point="$RUNNER_TEMP/fabushi-dmg-mount"
          mkdir -p "$mount_point"
          hdiutil attach "$dmg" -nobrowse -readonly -mountpoint "$mount_point"
          trap 'hdiutil detach "$mount_point" -force || true' EXIT
          test -d "$mount_point/Fabushi.app"
          test -d "$mount_point/Install Fabushi.app"
          test -L "$mount_point/Applications"
          codesign --verify --deep --strict --verbose=2 "$mount_point/Fabushi.app"
          codesign --verify --deep --strict --verbose=2 "$mount_point/Install Fabushi.app"
          xcrun stapler validate -v "$mount_point/Fabushi.app"
          xcrun stapler validate -v "$mount_point/Install Fabushi.app"
          spctl --assess --type execute --verbose=4 "$mount_point/Fabushi.app"
          spctl --assess --type execute --verbose=4 "$mount_point/Install Fabushi.app"

          installed_app="/Applications/Fabushi.app"
          rm -rf "$installed_app"
          /usr/bin/ditto "$mount_point/Fabushi.app" "$installed_app"
          codesign --verify --deep --strict --verbose=2 "$installed_app"
          xcrun stapler validate -v "$installed_app"
          spctl --assess --type execute --verbose=4 "$installed_app"
      - uses: actions/upload-artifact@v4
        with:
          name: gpui-telegram-macos-arm64
          path: |
            dist/Fabushi-*.dmg
            dist/Fabushi-*.pkg
            dist/Fabushi-*.zip
            dist/latest-mac.json
            dist/*.tar.gz
            dist/SHA256SUMS
            dist/RELEASE_NOTES.md
            target/release/gpui_telegram_desktop
            target/release/gpui_telegram_server
            target/release/fabushi
            target/release/fabushi-remote-daemon
          retention-days: 30
      - name: Upload macOS Assets to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.tag_name != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          TAG_NAME="${{ inputs.tag_name || github.ref_name }}"
          cp target/release/gpui_telegram_server "dist/gpui_telegram_server-${TAG_NAME}-macos-arm64"
          cp target/release/fabushi "dist/fabushi-${TAG_NAME}-macos-arm64"
          cp target/release/fabushi-remote-daemon "dist/fabushi-remote-daemon-${TAG_NAME}-macos-arm64"
          shasum -a 256 "dist/gpui_telegram_server-${TAG_NAME}-macos-arm64" "dist/fabushi-${TAG_NAME}-macos-arm64" "dist/fabushi-remote-daemon-${TAG_NAME}-macos-arm64" >> dist/SHA256SUMS
          gh release view "$TAG_NAME" >/dev/null 2>&1 || gh release create "$TAG_NAME" --title "Fabushi ${TAG_NAME}" --generate-notes
          assets=(
            dist/Fabushi-*.dmg
            dist/Fabushi-*.pkg
            dist/Fabushi-*.zip
            dist/latest-mac.json
            dist/*.tar.gz
            "dist/gpui_telegram_server-${TAG_NAME}-macos-arm64"
            "dist/fabushi-${TAG_NAME}-macos-arm64"
            "dist/fabushi-remote-daemon-${TAG_NAME}-macos-arm64"
            dist/SHA256SUMS
          )
          gh release upload "$TAG_NAME" "${assets[@]}" --clobber
      - name: Clean Up Temporary Signing Keychain
        if: always()
        shell: bash
        run: |
          if [ -n "${SIGNING_KEYCHAIN_PATH:-}" ] && [ -f "$SIGNING_KEYCHAIN_PATH" ]; then
            security delete-keychain "$SIGNING_KEYCHAIN_PATH" || true
          fi

  release-linux-x86_64:
    name: Build Linux x86_64 Release Archive (mold + 16-CGU ThinLTO)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Cache Linux APT Packages (mold + GPUI headers)
        uses: actions/cache@v4
        with:
          path: ~/apt-cache
          key: apt-ubuntu24-mold-gpui-v1
      - name: Install Linux Dependencies & mold Linker
        run: |
          PKGS="mold clang pkg-config protobuf-compiler libclang-dev libssl-dev libegl-dev libgl-dev libgles2-mesa-dev libpipewire-0.3-dev libspa-0.2-dev libgbm-dev libdrm-dev libdbus-1-dev libzstd-dev libsqlite3-dev libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libxcursor-dev libvulkan-dev libasound2-dev libfontconfig1-dev libfreetype6-dev"
          if [ -f ~/apt-cache/debs.tar.zst ]; then
            sudo tar --zstd -xf ~/apt-cache/debs.tar.zst -C /
            sudo apt-get install -y --no-install-recommends --no-upgrade $PKGS
          else
            mkdir -p ~/apt-cache
            sudo rm -f /var/cache/apt/archives/*.deb
            sudo apt-get update -o Acquire::Languages=none
            sudo apt-get install -y -d --no-install-recommends $PKGS
            sudo tar --zstd -cf ~/apt-cache/debs.tar.zst /var/cache/apt/archives /var/lib/apt/lists
            sudo chown -R "$USER:$USER" ~/apt-cache
            sudo apt-get install -y --no-install-recommends $PKGS
          fi
      - uses: dtolnay/rust-toolchain@stable
      - uses: mozilla-actions/sccache-action@v0.0.11
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          shared-key: "ubuntu-24-release-lto16-v1"
      - name: Build Parallel ThinLTO Linux Binaries
        run: |
          TAG_NAME="${{ inputs.tag_name || github.ref_name }}"
          cargo build --release --bin gpui_telegram_desktop --bin gpui_telegram_server --bin fabushi --bin fabushi-remote-daemon
          tar -czf "gpui_telegram-${TAG_NAME}-linux-x86_64.tar.gz" -C target/release gpui_telegram_desktop gpui_telegram_server fabushi fabushi-remote-daemon
          sccache --show-stats || true
      - uses: actions/upload-artifact@v4
        with:
          name: gpui-telegram-linux-x86_64
          path: gpui_telegram-*-linux-x86_64.tar.gz
          retention-days: 30
      - name: Upload Linux Archive to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.tag_name != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${{ inputs.tag_name || github.ref_name }}"
          gh release view "$TAG_NAME" >/dev/null 2>&1 || gh release create "$TAG_NAME" --title "Fabushi ${TAG_NAME}" --generate-notes
          gh release upload "$TAG_NAME" "gpui_telegram-${TAG_NAME}-linux-x86_64.tar.gz" --clobber

  release-windows-x86_64:
    name: Build Windows x86_64 Installer & Portable Archive (16-CGU ThinLTO)
    runs-on: windows-latest
    env:
      RUSTC_WRAPPER: ""
      SCCACHE_GHA_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - name: Setup Protobuf Compiler (protoc)
        uses: arduino/setup-protoc@v3
      - name: Ensure Inno Setup (ISCC)
        shell: pwsh
        run: |
          $iscc = Get-Command iscc -ErrorAction SilentlyContinue
          if (-not $iscc -and -not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          shared-key: "windows-latest-release-lto16-v1"
      - name: Build & Package Fabushi Windows x86_64 Installer & Portable ZIP
        shell: bash
        run: |
          set -euo pipefail
          TAG_NAME="${{ inputs.tag_name || github.ref_name }}"
          VERSION="${TAG_NAME#v}"
          cargo build --release --bin gpui_telegram_desktop --bin gpui_telegram_server --bin fabushi --bin fabushi-remote-daemon
          python scripts/package_windows.py --version "$VERSION" --require-installer
      - name: Smoke Test Windows Release Artifacts
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/Fabushi-*-windows-x86_64-setup.exe
          test -f dist/Fabushi-*-windows-x86_64.zip
          test -f dist/latest-windows.json
          test -f dist/SHA256SUMS-windows.txt
          ./target/release/fabushi.exe --version
          ./target/release/fabushi-remote-daemon.exe --version
          ls -lh dist/
      - uses: actions/upload-artifact@v4
        with:
          name: gpui-telegram-windows-x86_64
          path: |
            dist/Fabushi-*-windows-x86_64-setup.exe
            dist/Fabushi-*-windows-x86_64.zip
            dist/fabushi-v[0-9]*-windows-x86_64.exe
            dist/fabushi-remote-daemon-*-windows-x86_64.exe
            dist/gpui_telegram_server-*-windows-x86_64.exe
            dist/latest-windows.json
            dist/SHA256SUMS-windows.txt
          retention-days: 30
      - name: Upload Windows Assets to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.tag_name != ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG_NAME="${{ inputs.tag_name || github.ref_name }}"
          VERSION="${TAG_NAME#v}"
          gh release view "$TAG_NAME" >/dev/null 2>&1 || gh release create "$TAG_NAME" --title "Fabushi ${TAG_NAME}" --generate-notes
          assets=(
            "dist/Fabushi-${VERSION}-windows-x86_64-setup.exe"
            "dist/Fabushi-${VERSION}-windows-x86_64.zip"
            "dist/fabushi-${TAG_NAME}-windows-x86_64.exe"
            "dist/fabushi-remote-daemon-${TAG_NAME}-windows-x86_64.exe"
            "dist/gpui_telegram_server-${TAG_NAME}-windows-x86_64.exe"
            "dist/latest-windows.json"
            "dist/SHA256SUMS-windows.txt"
          )
          for asset in "${assets[@]}"; do
            test -f "$asset"
            gh release upload "$TAG_NAME" "$asset" --clobber
          done

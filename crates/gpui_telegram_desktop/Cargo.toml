[package]
name = "gpui_telegram_desktop"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"
test = false

[[bin]]
name = "gpui_telegram_desktop"
path = "src/main.rs"

[dependencies]
gpui_telegram_core = { workspace = true }
gpui_telegram_proto = { workspace = true }
gpui_telegram_code_scene = { workspace = true }
gpui_telegram_media = { workspace = true }
gpui_telegram_client = { workspace = true }
gpui_telegram_community = { workspace = true }
fabushi_remote_engine = { workspace = true }
gpui_telegram_agent = { workspace = true }
gpui_telegram_coding = { workspace = true }
bot-browser = { workspace = true }
zeroize = { workspace = true }
magpie_gateway = { workspace = true }
gpui_telegram_webrtc = { workspace = true }
gpui = { workspace = true }
image = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
parking_lot = { workspace = true }
tokio = { workspace = true }
futures = { workspace = true }
reqwest = { workspace = true }
sha2 = { workspace = true }
qrcode = { version = "0.14.1", default-features = false }
fabushi-messaging-core = { path = "../../inherited/mahayana-messaging" }
mahayana-node-agent-coordinator = { path = "../../inherited/node-agent-coordinator" }
mahayana-host-runtime = { path = "../../inherited/host" }

[dev-dependencies]
tempfile = "3"

[target.'cfg(target_os = "macos")'.dependencies]
raw-window-handle = "0.6.2"
objc = "0.2.7"

[target.'cfg(target_os = "macos")'.build-dependencies]
cc = "1"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

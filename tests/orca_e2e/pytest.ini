[pytest]
pythonpath = . ../..
testpaths = .
python_files = test_*.py
addopts = -p no:cacheprovider --strict-markers
markers =
    tier1: Tier 1 isolated feature coverage
    tier2: Tier 2 boundary, negative, security, concurrency & upstream edge cases
    tier3: Tier 3 cross-feature pairwise interactions
    tier4: Tier 4 multi-step real-world end-to-end scenarios
    harness_self_check: Meta self-integrity checks for the E2E harness (excluded from Tiers 1-4)
    f01: F01 Bot Identity, 22-Agent Schema & CAS Avatars
    f02: F02 Bot Home Generator, Authority Preamble, First-Run & NO_REPLY
    f03: F03 Host-Enforced Memory Governance, Journal, Tidy-Up & 14d Re-Add Guard
    f04: F04 Event-Sourced Bot Items, Multi-Decision Ask Cards & Needs You Inbox
    f05: F05 Proactive Read-Only Look Around -> Up Next
    f06: F06 Multi-Bot Group Rooms, Sub-Threads, Peer Mail & Remote Bot Members
    f07: F07 24 Bot Templates, 13 Skills, Packages, E2EE Team Share, Import & Hand-Over
    f08: F08 Loopback Credential-Isolating Tool Relay, Host OAuth 2.1 & Shared MCP Pool
    f09: F09 External Connectors, Acts For, Access Control, Slack Mirror, Triggers, Webhooks & Waits
    f10: F10 Strict orca.yaml, .worktreeinclude, Folder Workspaces & Parallel Worktrees
    f11: F11 Durable SQLite Multi-Agent Orchestration & Cross-Host Federation
    f12: F12 Extended 22+ CLI Agents, Event-Sourced Chat Journal & Chat<->Terminal Continuation
    f13: F13 4-State Agent Status Engine, Hook Server, Screen-Anchor Rules & Safe Hibernation
    f14: F14 Detached PTY Persistence, Cold-Park, Credit/ACK Multiplex Flow Control & Tombstones
    f15: F15 Multi-Account Hot-Swap & 9-Provider Usage / Rate-Limit Roster
    f16: F16 Domain-Partitioned ProfileState SQLite, AtomicSnapshotWriter, Keyring & AI Vault FTS
    f17: F17 Annotate AI Diff, Line-Level AI Attribution, Source Control & Tasks Hub
    f18: F18 Embedded Browser Design Mode, Safe Computer Use & Mobile Emulator
    f19: F19 4-Tier Capability-Gated Plugin System V2, MCP Sync & Transactional Skills
    f20: F20 Unified RPC Dispatcher, Capability Protocol v3, E2EE v2 Relay/Wake, VMs, STT, Artifacts & Watchdog
    f21: F21 Server REST/WS/Webhook/Wake API, Telegram IM Bridge Fusion, Typed Client & fabushi CLI
    f22: F22 Native GPUI Desktop UI (Bots Surface, Needs You, Split Anything, Cmd+J, Diff, Design Mode, Kanban)
    f23: F23 Opaque-Box E2E Suite (Tiers 1-4) + Tier 5 Adversarial Hardening
    f24: F24 Ledger Preservation, CI/Deploy Workflows, Version v1.7.0 Bump, Git Push & GitHub Release
    edge_case(id): Upstream edge case ID (SM1-01..SM1-14, SM2-01..SM2-26)
